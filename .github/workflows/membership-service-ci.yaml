name: membership-service CI

on:
#  push:
#    paths:
#      - 'membership-service/**'
#      - 'eak-bom/**'
  workflow_dispatch:


jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install BOM
        run: mvn clean install -pl eak-bom -DskipTests


      - name: Build and Test
        run: mvn clean verify -pl membership-service

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          docker build -t georgeestav/membership-service:${{ github.sha }} ./membership-service

          docker tag georgeestav/membership-service:${{ github.sha }} georgeestav/membership-service:latest

          docker push georgeestav/membership-service:${{ github.sha }}
          docker push georgeestav/membership-service:latest