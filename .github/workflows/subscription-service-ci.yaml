name: subscription-service CI

on:
  push:
    paths:
      - 'subscription-service/**'
      - 'eak-bom/**'
  workflow_dispatch:


jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install BOM
        working-directory: eak-bom
        run: mvn clean install -DskipTests

      - name: Build and Test
        working-directory: subscription-service
        run: mvn clean verify

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          docker build -t georgeestav/subscription-service:${{ github.sha }} ./subscription-service

          docker tag georgeestav/subscription-service:${{ github.sha }} georgeestav/subscription-service:latest

          docker push georgeestav/subscription-service:${{ github.sha }}
          docker push georgeestav/subscription-service:latest