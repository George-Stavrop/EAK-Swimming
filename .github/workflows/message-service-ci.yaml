name: message-service CI

on:
#  push:
#    paths:
#      - 'message-service/**'
#      - 'eak-bom/**'
  workflow_dispatch:


jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install BOM
        working-directory: eak-bom
        run: mvn clean install -DskipTests

      - name: Build and Test
        working-directory: message-service
        run: mvn clean verify

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          docker build -t georgeestav/message-service:${{ github.sha }} ./message-service

          docker tag georgeestav/message-service:${{ github.sha }} georgeestav/message-service:latest

          docker push georgeestav/message-service:${{ github.sha }}
          docker push georgeestav/message-service:latest