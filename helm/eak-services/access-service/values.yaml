# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

deploymentName: access-service-deployment
serviceName: access-service
appLabel: access-service
appName: access-service

replicaCount: 1

image:
  repository: georgeestav/access-service
  tag: v2.0

containerPort: 8090

service:
  type: ClusterIP
  port: 8090
  targetPort: 8090

appname_enabled: true
profile_enabled: true
config_enabled: true
eureka_enabled: true
resourceserver_enabled: false
otel_enabled: false
rabbitmq_enabled: false
