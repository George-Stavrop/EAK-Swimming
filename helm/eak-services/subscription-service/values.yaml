# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

deploymentName: subscription-service-deployment
serviceName: subscription-service
appLabel: subscription-service
appName: subscription-service

replicaCount: 1

image:
  repository: georgeestav/subscription-service
  tag: v2.0

containerPort: 9000

service:
  type: ClusterIP
  port: 9000
  targetPort: 9000

appname_enabled: true
profile_enabled: true
config_enabled: true
eureka_enabled: true
resourceserver_enabled: false
otel_enabled: false
rabbitmq_enabled: false